<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with padding for maskable safe zone -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(59, 130, 246, 0.25)" stroke-width="4" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="240" r="140" fill="#3b82f6" opacity="0.18" filter="url(#glow)" />

  <!-- Central Emblem: Stylized Open Digital Book & Center Tower -->
  <g transform="translate(256, 256) scale(1.15)">
    <!-- Base Book Wings -->
    <path d="M-100,50 C-60,30 -20,30 0,55 C20,30 60,30 100,50 L100,-30 C60,-50 20,-50 0,-25 C-20,-50 -60,-50 -100,-30 Z" 
          fill="url(#primaryGrad)" opacity="0.9" filter="url(#glow)" />
    
    <!-- Inner Pages / Code Screen lines -->
    <path d="M-85,30 C-50,15 -20,15 -6,35 L-6,-15 C-20,-35 -50,-35 -85,-20 Z" 
          fill="#ffffff" opacity="0.85" />
    <path d="M85,30 C50,15 20,15 6,35 L6,-15 C20,-35 50,-35 85,-20 Z" 
          fill="#ffffff" opacity="0.85" />

    <!-- Center Graduation / Tech Diamond Beacon -->
    <polygon points="0,-85 38,-65 0,-45 -38,-65" fill="url(#glowGrad)" />
    <circle cx="0" cy="-65" r="8" fill="#ffffff" />
    
    <!-- Dynamic Orbit Nodes -->
    <circle cx="-85" cy="-60" r="7" fill="#38bdf8" />
    <circle cx="85" cy="-60" r="7" fill="#34d399" />
    <path d="M-85,-60 Q-38,-90 0,-65 Q38,-90 85,-60" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-dasharray="4,4" />
  </g>

  <!-- Typography Mark / Initials LW -->
  <text x="256" y="445" font-family="'Cairo', system-ui, sans-serif" font-weight="800" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    ليرن ويب • LERN WEB
  </text>
</svg>
